name: Recolha

on:
  workflow_dispatch:          # disparado pelo cron-job.org a cada 5 min
  schedule:
    - cron: "2-59/5 * * * *"  # redundância, alinhada com o ciclo do feed (minutos 2, 7, 12, ...)

concurrency:
  group: recolha
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recolha:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      # Estado e arquivo vivem no repositório PRIVADO (segredos DATA_REPO e DATA_TOKEN, passados só
      # aos passos que os usam; o endereço é montado dentro de cada script e nunca fica no env).
      STATE_DIR: ${{ github.workspace }}/state
      DATA_DIR: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@v5
        with:
          # Sem isto, o checkout grava o token do repositório público na configuração do git
          # e os comandos seguintes usam-no no lugar do DATA_TOKEN (sem acesso ao privado).
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Configurar git
        run: |
          git config --global user.name "coletor"
          git config --global user.email "coletor@users.noreply.github.com"

      - name: Obter estado
        env:
          DATA_REPO: ${{ secrets.DATA_REPO }}
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: |
          [ -n "$DATA_REPO" ] || { echo "::error::Segredo DATA_REPO em falta. Run interrompido para não perder o estado."; exit 1; }
          DATA_URL="https://x-access-token:${DATA_TOKEN}@github.com/${DATA_REPO}.git"
          # 0 = branch existe · 2 = branch não existe · outro = erro de acesso (falha o run, nunca recomeça do zero)
          set +e; git ls-remote --exit-code --heads "$DATA_URL" state >/dev/null; rc=$?; set -e
          if [ "$rc" = 0 ]; then
            git clone -q --depth 1 --branch state "$DATA_URL" state
            echo "Estado lido do repositório privado."
          elif [ "$rc" = 2 ]; then
            echo "::warning::Branch state inexistente no repositório privado: a iniciar estado vazio."
            mkdir state && git -C state init -q -b state
            touch state/.novo
          else
            echo "::error::Sem acesso ao repositório privado (código $rc). Confirmar os segredos DATA_TOKEN e DATA_REPO. Run interrompido para não perder o estado."
            exit 1
          fi
          git -C state remote remove origin 2>/dev/null || true
          git -C state remote add origin "$DATA_URL"

      - name: Recolher
        run: python -m coletor.collect

      - name: Dias por arquivar
        id: arq
        env:
          DATA_REPO: ${{ secrets.DATA_REPO }}
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: |
          DATA_URL="https://x-access-token:${DATA_TOKEN}@github.com/${DATA_REPO}.git"
          python -m coletor.archive pending
          set +e; git ls-remote --exit-code --heads "$DATA_URL" data >/dev/null; rc=$?; set -e
          if [ "$rc" = 0 ]; then
            echo "data_ok=1" >> "$GITHUB_OUTPUT"
          elif [ "$rc" = 2 ]; then
            echo "::warning::Branch data inexistente no repositório privado. Os dias ficam no estado até existir."
            echo "data_ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Sem acesso ao branch data (código $rc)."
            exit 1
          fi

      - name: Exportar para branch data
        if: steps.arq.outputs.pending != '0' && steps.arq.outputs.data_ok == '1'
        env:
          DATA_REPO: ${{ secrets.DATA_REPO }}
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: |
          DATA_URL="https://x-access-token:${DATA_TOKEN}@github.com/${DATA_REPO}.git"
          git clone -q --depth 1 --filter=blob:none --sparse --branch data "$DATA_URL" data
          python -m coletor.archive export
          cd data
          git add --sparse -A .
          git commit -qm "Arquivo $(TZ=Europe/Lisbon date +%F)" || echo "Nada a arquivar"
          git push -q origin HEAD:data

      - name: Limpar estado arquivado
        if: steps.arq.outputs.pending != '0' && steps.arq.outputs.data_ok == '1'
        run: python -m coletor.archive cleanup

      - name: Guardar estado
        # Não corre se o job for cancelado (incluindo por limite de tempo): mantém-se o estado anterior.
        if: ${{ !cancelled() }}
        env:
          DATA_REPO: ${{ secrets.DATA_REPO }}
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: |
          DATA_URL="https://x-access-token:${DATA_TOKEN}@github.com/${DATA_REPO}.git"
          [ -d state ] || { echo "Sem estado para guardar."; exit 0; }
          # Proteção: um estado novo nunca substitui um estado que já exista no privado.
          if [ -f state/.novo ]; then
            rm state/.novo
            set +e; git ls-remote --exit-code --heads "$DATA_URL" state >/dev/null; rc=$?; set -e
            if [ "$rc" != 2 ]; then echo "::error::Já existe estado no privado (código $rc): não substituído."; exit 1; fi
          fi
          cd state
          git checkout -q --orphan snap
          git add -A
          git commit -qm "estado $(date -u +%FT%TZ)"
          # Até 3 novas tentativas do push (esperas de 10, 20 e 40 s); o passo só falha depois da última.
          ok=0
          for espera in 0 10 20 40; do
            if [ "$espera" != 0 ]; then
              echo "::warning::Push do estado falhou; nova tentativa daqui a ${espera} s."
              sleep "$espera"
            fi
            git push -qf origin snap:state && { ok=1; break; }
          done
          if [ "$ok" = 0 ]; then echo "::error::Push do estado falhou após 4 tentativas."; exit 1; fi
          echo "Estado guardado."
